<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sesi Yazıya Çevir · Dijital Çakı</title>
<meta name="description" content="Ses kayıtları ve videolardaki Türkçe konuşmayı tarayıcıda metne çevir.">
<meta name="theme-color" content="#efede8">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="app.js?v=2"></script>
</head>
<body><main class="tool">
<header><a class="back" href="/">Uygulamalar</a>
<h1>Sesi Yazıya Çevir</h1>
<p class="intro">Ses kaydındaki veya videodaki Türkçe konuşmayı düzenlenebilir metne çevir. Dosyan cihazında kalır.</p></header>
<section class="panel">
<label for="file">Ses veya video dosyası</label>
<input id="file" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.ogg,.opus,.aac,.flac,.mp4,.mov,.m4v,.webm,.mkv,.avi" aria-describedby="file-note model-note">
<p class="intro" id="file-note">MP3, WAV, M4A, MP4, MOV ve diğer biçimler · 100 MB, 30 dakika</p>
<p class="intro" id="model-note">İlk kullanımda yaklaşık 100 MB model indirilir.</p>
<div class="row">
  <button id="run" class="primary" disabled>Yazıya çevir</button>
  <button id="cancel" hidden>İptal</button>
</div>
<p id="status" role="status"></p>
</section>
<section class="panel" id="output" hidden>
  <label for="transcript">Çıkarılan metin</label>
  <textarea id="transcript" rows="7"></textarea>
  <div class="row">
    <button id="copy" class="primary">Metni kopyala</button>
    <button id="download">TXT indir</button>
  </div>
</section>
</main></body></html>
